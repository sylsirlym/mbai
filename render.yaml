# Render Blueprint: New → Blueprint → pick this repo. Creates the app and its Postgres database.
services:
  - type: web
    name: mbai
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mbai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: mbai-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
